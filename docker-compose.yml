services:
  db:
    image: postgres
    restart: always
    environment:
      POSTGRES_PASSWORD: password
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
    # volumes:
    #   - ./data:/var/lib/postgresql/data
    ports:
      - 5432:5432
  app:
    # image: localhost/jroddev/shopping-list-dioxus:0.2
    image: shopping-list-dioxus:dev
    build: "."
    environment:
      POSTGRES_PASSWORD: password
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
      POSTGRES_HOST: db
    ports:
      - 8080:8080
