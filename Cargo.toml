[package]
name = "shopping-list-dioxus"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
dioxus = { version = "0.7.0-rc.0", features = ["router", "fullstack"] }
serde = { version = "1.0.193", features = ["derive"] }
uuid = { version = "1.6.1", features = ["v4", "serde", "js"] }
chrono = { version = "0.4.31", features = ["serde"] }
sqlx = { version = "0.7.2", features = [
    "runtime-tokio",
    "postgres",
    "migrate",
    "uuid",
    "chrono",
], optional = true }
dioxus-logger = "0.5.1"
log = "0.4.20"
dioxus-free-icons = { version = "0.10.0-alpha.1", features = ["bootstrap"] }
tokio = { version = "1.34.0", features = ["full"], optional = true }

[features]
default = ["web"]
web = ["dioxus/web"]
desktop = ["dioxus/desktop"]
server = ["sqlx", "tokio", "dioxus/server"]
